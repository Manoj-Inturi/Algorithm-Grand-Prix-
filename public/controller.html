<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Algorithm Grand Prix</title>

    <link
        rel="stylesheet"
        href="css/controller.css"
    >

</head>


<body>

    <main class="controller">


        <!-- =================================
             HEADER
        ================================== -->

        <header class="header">

            <p class="eyebrow">
                ALGORITHM GRAND PRIX
            </p>

            <h1>
                JOIN THE RACE
            </h1>

            <p class="subtitle">
                Connecting to race...
            </p>

        </header>



        <!-- =================================
             ALGORITHM SELECTION
        ================================== -->

        <section class="algorithm-section">

            <div class="section-label">

                <span>
                    CHOOSE ALGORITHM
                </span>

                <span>
                    01
                </span>

            </div>


            <div class="algorithm-grid">


                <!-- BFS -->

                <button
                    class="algorithm-card"
                    data-algorithm="BFS"
                    type="button"
                >

                    <span
                        class="algorithm-dot bfs"
                    ></span>


                    <span class="algorithm-content">

                        <strong>
                            BFS
                        </strong>

                        <small>
                            BREADTH-FIRST SEARCH
                        </small>

                    </span>

                </button>



                <!-- DFS -->

                <button
                    class="algorithm-card"
                    data-algorithm="DFS"
                    type="button"
                >

                    <span
                        class="algorithm-dot dfs"
                    ></span>


                    <span class="algorithm-content">

                        <strong>
                            DFS
                        </strong>

                        <small>
                            DEPTH-FIRST SEARCH
                        </small>

                    </span>

                </button>



                <!-- DIJKSTRA -->

                <button
                    class="algorithm-card"
                    data-algorithm="Dijkstra"
                    type="button"
                >

                    <span
                        class="algorithm-dot dijkstra"
                    ></span>


                    <span class="algorithm-content">

                        <strong>
                            DIJKSTRA
                        </strong>

                        <small>
                            WEIGHTED SHORTEST PATH
                        </small>

                    </span>

                </button>



                <!-- A* -->

                <button
                    class="algorithm-card"
                    data-algorithm="A*"
                    type="button"
                >

                    <span
                        class="algorithm-dot astar"
                    ></span>


                    <span class="algorithm-content">

                        <strong>
                            A*
                        </strong>

                        <small>
                            HEURISTIC SEARCH
                        </small>

                    </span>

                </button>


            </div>

        </section>



        <!-- =================================
             SELECTED ALGORITHM
        ================================== -->

        <section
            id="selected-section"
            class="selected-section hidden"
        >

            <div class="selected-box">

                <p>
                    SELECTED ALGORITHM
                </p>

                <h2 id="selected-algorithm">
                    —
                </h2>

            </div>

        </section>



        <!-- =================================
             A* HEURISTIC
        ================================== -->

        <section
            id="astar-control"
            class="control-section hidden"
        >

            <div class="section-label">

                <span>
                    A* HEURISTIC WEIGHT
                </span>

                <span id="heuristic-value">
                    1.0
                </span>

            </div>


            <div class="slider-container">

                <input
                    id="heuristic"
                    type="range"
                    min="0"
                    max="2"
                    step="0.1"
                    value="1"
                >


                <div class="slider-labels">

                    <span>
                        0
                    </span>

                    <span>
                        1
                    </span>

                    <span>
                        2
                    </span>

                </div>

            </div>

        </section>



        <!-- =================================
             CURRENT MAZE
        ================================== -->

        <section class="maze-controls">

            <div class="section-label">

                <span>
                    CURRENT MAZE
                </span>

                <span id="maze-status">
                    WAITING
                </span>

            </div>


            <div class="controller-maze">

                <canvas
                    id="controller-maze-canvas"
                ></canvas>

            </div>


            <p
                class="maze-info"
                id="maze-info"
            >
                Waiting for the main screen to
                select a maze.
            </p>

        </section>



        <!-- =================================
             READY
        ================================== -->

        <section class="ready-section">

            <button
                id="ready-button"
                class="ready-button"
                type="button"
            >
                READY
            </button>


            <p>
                Select an algorithm before confirming.
            </p>

        </section>


    </main>



    <!-- =================================
         SOCKET.IO
    ================================== -->

    <script src="/socket.io/socket.io.js"></script>



    <!-- =================================
         MAZE MAPS
    ================================== -->

    <script src="js/maze/maps.js"></script>

    <script src="js/maze/generator.js"></script>



    <!-- =================================
         CONTROLLER JAVASCRIPT
    ================================== -->

    <script src="js/controller.js"></script>


</body>

</html>
