<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Algorithm Grand Prix is a live multiplayer pathfinding race that visualizes BFS, DFS, Dijkstra and A* on one shared maze.">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta name="theme-color" content="#000000">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Algorithm Grand Prix | Pathfinding Algorithm Race">
    <meta property="og:description" content="Watch four pathfinding strategies race through the same maze in an educational interactive visualization.">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Algorithm Grand Prix | Pathfinding Algorithm Race">
    <meta name="twitter:description" content="A real-time educational maze race featuring BFS, DFS, Dijkstra and A*.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Algorithm Grand Prix",
            "applicationCategory": "EducationalApplication",
            "description": "A multiplayer pathfinding visualization where BFS, DFS, Dijkstra and A* race through the same maze.",
            "operatingSystem": "Web Browser"
        }
    </script>
    <link rel="canonical" href="/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Algorithm Grand Prix | Pathfinding Algorithm Race</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: Arial, sans-serif; display: grid; place-items: center; }
        main { width: min(620px, 92vw); padding: 40px; border: 1px solid #292929; background: #050505; }
        p { color: #777; font-size: 11px; letter-spacing: 3px; }
        h1 { margin: 10px 0 12px; font-size: clamp(30px, 7vw, 46px); line-height: .95; }
        .lead { color: #999; letter-spacing: 0; font-size: 14px; line-height: 1.6; max-width: 520px; }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
        a { display: block; padding: 16px; border: 1px solid #333; color: #fff; text-decoration: none; text-align: center; letter-spacing: 1.5px; font-size: 12px; }
        a:hover { border-color: #777; }
        .note { margin-top: 18px; color: #555; letter-spacing: 0; font-size: 11px; }
        @media (max-width: 620px) { main { padding: 28px; } .actions { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main>
        <p>ALGORITHM GRAND PRIX</p>
        <h1>PATHFINDING ALGORITHM RACE</h1>
        <div class="lead">Four players. One maze. BFS, DFS, Dijkstra and A* race side by side with live exploration, decisions and results.</div>
        <div class="actions">
            <a href="/screen">OPEN MAIN SCREEN</a>
            <a href="/controller">JOIN PLAYER CONTROLLER</a>
        </div>
        <div class="note">Use the QR code on the main screen to join from a phone.</div>
    </main>
</body>
</html>
